# ============
# START PRINT
# ============
[gcode_macro PRINT_START]

gcode:

    AUTOTUNE_SHAPERS 

    DISABLE_ALL_SENSOR # turns off filament runout sensor*

    LED_ON

    CLEAR_PAUSE

    {% set bedtemp = params.get('BED') | int %}

    {% set hotendtemp = params.get('HOTEND') | int %}

    {% set chambertemp = params.get('CHAMBER', 0) | int %}

    {% set extruder = params.EXTRUDER|default(0)|int %}


    M118 PRINT SEQUENCE STARTED

    M140 S{bedtemp}  # start bed heating to printing temp

    M104 S140 # start to heat nozzle to 140c

    {% if "xyz" not in printer.toolhead.homed_axes %}  # Home only if required
        M118 Homing printer...
        G28
    {% endif %}


    {% if chambertemp == 0 %} 

        M106 P3 S0              # REAR EXTRACT FAN: original M106 P3 S255(100%), options M106 P3 S85(33%) or S127(50%) or S170(66%)

    {% endif %}


    M141 S{chambertemp}  # chamber heater set in the slicer  

    SET_GCODE_OFFSET Z=0 MOVE=0

    #M118 CLEAR & CLEAN NOZZLE

    #MY_CLEAR_NOZZLE HOTEND={hotendtemp} # filament purge and nozzle clean. Not considered nessesary.


    M118 WAITING FOR BED TEMPERATURE

    M190 S{bedtemp}     # wait for bed temp final temp

    M118 Z_TILT_ADJUST                         

    Z_TILT_ADJUST #  Z tilt adjust

    M400

    M118 KAMP ADAPTIVE BED MESH

    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=ADAPTIVE PROBE_COUNT=7,7 

    SMART_PARK  # adjustments found in KAMP Settings.cfg                    

    # G0 Z50 F600         # use instead of SMART PARK
    # G0 X260 Y5 F30000  # use instead of SMART PARK

    M118 WAITING FOR TEMPERATURES

    M191 S{chambertemp} # wait for chamber temp, if asked for

    M109 S{hotendtemp} # waiting for extruder final temp

    M204 S8000  # ORIGINAL 10000. extruder acceleration

    set_zoffset # set the Z offset of nozzle

    save_last_file # save print to the jobs list

    M118 PRINT STARTED

    LED_ON # attempt to keep the light on at print start (first layer)

    LINE_PURGE  # KAMP's purge line*

# ====================
# PRINT_END
# ====================


[gcode_macro MY_PRINT_END]
gcode:
   
    M400 # Finish all queued movements

    # Safety check: do not move if axes are not homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("MY_PRINT_END: XYZ not homed; movement cancelled")}
    {% endif %}

    # Record current Z and calculate safe heights
    {% set current_z = printer.toolhead.position.z %}
    {% set max_z = printer.configfile.settings.stepper_z.position_max %}
    {% set lift_z = [current_z + 10, max_z]|min %}
    {% set final_z = [current_z + 50, max_z]|min %}

    # Retract filament by 3mm
    M83
    G1 E-3 F1800

    # Raise Z before moving XY
    G90
    G1 Z{lift_z} F600

    
    # move extruder to trash position
    M204 S6000

    {% if printer.gcode_move.position.y > 270 %}
        {% if printer.gcode_move.position.x > 112 or printer.gcode_move.position.x < 85 %}
            G1 Y270 F6000
        {% endif %}
        G1 X85 F6000
        G1 Y287.5 F1000
    {% else %}
        G1 X85 F6000
        G1 Y260 F6000
        G1 Y287.5 F1000
    {% endif %}

    
    M204 S8000 # Restore normal acceleration

    G1 Z{final_z} F600 # Raise Z for print removal

    save_zoffset

    UPDATE_LUBRICATION_TIME # add print time to the lubrication counter

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    CLEAR_PAUSE

    M106 P2 S0 # turn off all heaters
    M106 P0 S0
    M104 S0
    M140 S0
    M141 S0

    M220 S100 # Resets the speed override to 100% (normal speed).
    M221 S100 # Resets the extrusion flow override to 100% (normal extrusion).

    DISABLE_ALL_SENSOR

    BED_MESH_CLEAR # Clears the active bed mesh compensation.

    G31 # use KAMP settings

    CLEAR_LAST_FILE # clear last print

    BEEP I=2 DUR=500 # double beep (I=2)

    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready


# =========================
# CANCEL PRINT + LUBRICATION
# =========================

[gcode_macro CANCEL_PRINT]
rename_existing: QIDI_CANCEL_PRINT
gcode:

    UPDATE_LUBRICATION_TIME  # add print time to the lubrication counter

    QIDI_CANCEL_PRINT

    UPDATE_DELAYED_GCODE ID=LUBRICATION_IDLE_CHECK DURATION=120  # check lubrication timer after 2 minutes of idle time  



# ============================================================
# LOAD FILAMENT. PART-1
# ============================================================

[gcode_macro LOAD_FILAMENT]

description: Load filament - choose filament type

gcode:

    #BEEP DUR=100

    RESPOND TYPE=command MSG="action:prompt_begin FILAMENT LOAD"

    RESPOND TYPE=command MSG="action:prompt_text INSERT FILAMENT INTO THE EXTRUDER"

    RESPOND TYPE=command MSG="action:prompt_text CHOOSE FILAMENT & PURGE LENGTH"

    RESPOND TYPE=command MSG="action:prompt_show"

    RESPOND TYPE=command MSG="action:prompt_footer_button PLA/PETG 20mm|LOAD_FILAMENT_PLA_PETG|primary"

    RESPOND TYPE=command MSG="action:prompt_footer_button PLA/PETG 45mm|LOAD_FILAMENT_PETG_PLA|primary"
    
    RESPOND TYPE=command MSG="action:prompt_footer_button ASA/ABS 45mm|LOAD_FILAMENT_ASA_ABS|primary"  


# ============================================================
# LOAD PLA_PETG FILAMENT. PART-2
# ============================================================

[gcode_macro LOAD_FILAMENT_PLA_PETG]

description: Load filament, purge 20mm @225c

gcode:

    RESPOND TYPE=command MSG="action:prompt_end"

    M118 LOADING TPU/PLA/PETG FILAMENT, 20mm TO PURGE

    LED_ON

    M104 S225  # nozzle temp
    M140 S40   # early start bed heat, to save some time when print is started

    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=180 # reach 180C before moving on

    #M118 NOZZLE HOT, LOADING FILAMENT

    G92 E0      # reset extruder
    M83         # Set the extruder to relative extrusion mode
    G1 E10 F400 # advance filament into hotend before homing extruder 
    M400        # finish move above

    {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
        M118 Homing printer...
        G28
    {% endif %} 

    MOVE_TO_TRASH

    M109 S225  # Wait for nozzle temp

    G92 E0      # Reset the extruder 
    M83         # Set the extruder to relative extrusion mode
    G1 E65 F400 # feed filament to the nozzle
    M400        # finish move above

    M118 PURGE 20mm
    G92 E0      # Reset the extruder 
    M83         # Set the extruder to relative extrusion mode
    G1 E20 F200 # 20mm purge
    G1 E-2 F300 # retract a little
    M400
    
    M104 S140   # call for lower nozzle temp to reduce oozing

    M204 S5000

    G1 X103 F5000 # Shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

   
    G1 X114 F5000 # Move to roller and wipe nozzle
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    M400

    M118  FILAMENT LOADED, 20mm PURGED

    RESPOND TYPE=command MSG="action:prompt_end"

    BEEP DUR=100


