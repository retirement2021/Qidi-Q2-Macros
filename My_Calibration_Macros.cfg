        G28
    {% endif %}

    G1 X135 Y135 Z10 # move to centre of bed

    PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP}

    TURN_OFF_HEATERS

    G4 P1000 # dwell

    SAVE_CONFIG

    MY_MOVE_TO_TRASH

    BEEP DUR=100

    M118 PID_EXTRUDER_FINISHED

# =================
# MY_MOVE_TO_TRASH
# =================

[gcode_macro MY_MOVE_TO_TRASH]
description: Simple home if needed and PARK at the trash position. 
gcode:

    LED_ON

    {% if "xyz" not in printer.toolhead.homed_axes %}
        M118 home printer...
        G28
    {% endif %}

    M204 S3000

    {% if (printer.gcode_move.position.y) > 270 %}
        {% if (printer.gcode_move.position.x) > 112 or (printer.gcode_move.position.x) < 85 %}
            G1 Y270 F6000
            G1 X85 F6000
            G1 Y270 F6000
            G1 Y287.5 F1000
        {% endif %}
        G1 X85 F26000
        G1 Y287.5 F1000
    {% else %}
        G1 X85 F6000
        G1 Y260 F6000
        G1 Y287.5 F1000
    {% endif %}

# ===========
# BED MESH
# ===========

[gcode_macro PROBE_BED]
description: Full bed mesh calibration
gcode:

    M118 BED MESH CALIBRATION IN PROGRESS

    M140 S50 # Start heating bed while nozzle is being cleaned

    {% set brush_y = range(283, 289) | random %}  # parameters of random brush wiping

    BED_MESH_CLEAR

    SET_STEPPER_ENABLE STEPPER=extruder enable=0

    {% if "xyz" not in printer.toolhead.homed_axes %}  # Home only if required
        M118 Homing printer...
        G28
    {% endif %}

    M118 NOZZLE WIPE # important that nozzle is clean due to nozzle being the probe

    MOVE_TO_TRASH # Move to nozzle cleaning area

    M109 S200 # Heat nozzle

    M104 S140 # start to reduce nozzle temp
    M106 S255 # start cooling fan 100%

    M204 S5000

    G1 X103 F5000 # shake ooze sequence
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180  # wait for temp to reduce to 180C to proceed

    G1 X125 F15000
    G1 X130 Y280 F6000
    G1 Z-0.2 F600

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 X140 F200
    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Z0.2
    G1 X180 F6000
    G1 Y{brush_y} F6000  # Randomise the Y axis brush cleaning position
    G1 X161 F3000        # move to brush
    M400                 # finsh above move
    G1 Z-1.5             # drop nozzle into the brush

    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 Z5  # raise bed a little

    M400 # finish above moves before moving on

    M106 S0  # stop the cooling fan

    M190 S50 # Wait for bed to reach temperature

    M118 PROBE THE BED 9X9

    BED_MESH_CALIBRATE PROFILE=full_bed_9x9 # Perform the KAMP bed mesh

    SAVE_VARIABLE VARIABLE=profile_name VALUE='"full_bed_9x9"'

    #G1 X135 Y135 Z10 # move to centre of bed or trash area
    MOVE_TO_TRASH

    M118 FINISHED BED MESH

    BEEP DUR=100 # Single beep

    G4 P1000 # dwell

    SAVE_CONFIG_QD

# ============================================================
# LUBRICATION MAINTENANCE USER SETTINGS
# ============================================================

[gcode_macro LUBRICATION_SETTINGS]
description: alter any of these to your own requirements

variable_interval: 35.0 # Lubrication interval in actual printing hours

variable_x_cycles: 4 # Number of X full-travel cycles

variable_y_cycles: 4 # Number of Y full-travel cycles

variable_z_cycles: 3 # Number of Z up/down cycles

variable_xy_speed: 45 # X/Y lubrication speed in mm/s

variable_z_speed: 15 # Z lubrication speed in mm/s

gcode:
    # Settings only

# ============================================================
# AUTOMATIC LUBRICATION STARTUP CHECK
# ============================================================

[delayed_gcode LUBRICATION_STARTUP_CHECK]
initial_duration: 5

gcode:

    CHECK_LUBRICATION

# ============================================================
# START LUBRICATION
# ============================================================

[gcode_macro START_LUBRICATION]
description: Prepare printer for cleaning & lubrication

gcode:

    LED_ON

    {% if "xyz" not in printer.toolhead.homed_axes %}
        M118 LUBRICATION: homing printer...
        G28
    {% endif %}

    M118 PREPARING PRINTER FOR A CLEAN & LUBRICATE

    G90
    
    G1 Z246 F1000 # Move bed to safe lubrication position

    G1 X135 Y40 F3000 # Move toolhead to front centre

    M400 # finish moves above

     # Release X and Y motors so toolhead can be moved by hand
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0

    M118 CLEAN/LUBRICATE ALL RAILS/RODS & SCREWS

    RESPOND TYPE=command MSG="action:prompt_begin Lubrication Maintenance"
    RESPOND TYPE=command MSG="action:prompt_text Clean & Lubricate the X rail, Y rods and Z lead screws/guides. When finished, press the button below."
    RESPOND TYPE=command MSG="action:prompt_button LUBRICANT APPLIED|RUN_LUBRICATION_CYCLES"
    RESPOND TYPE=command MSG="action:prompt_show"

# ============================================================
# RUN LUBRICATION CYCLES
# ============================================================

[gcode_macro RUN_LUBRICATION_CYCLES]
description: Work lubricant into X Y and Z mechanisms

gcode:

    LED_ON

    {% set x_cycles = printer["gcode_macro LUBRICATION_SETTINGS"].x_cycles|int %}
    {% set y_cycles = printer["gcode_macro LUBRICATION_SETTINGS"].y_cycles|int %}
    {% set z_cycles = printer["gcode_macro LUBRICATION_SETTINGS"].z_cycles|int %}

    {% set xy_speed = printer["gcode_macro LUBRICATION_SETTINGS"].xy_speed|float * 60 %}
    {% set z_speed = printer["gcode_macro LUBRICATION_SETTINGS"].z_speed|float * 60 %}

    # Close the lubrication popup
    RESPOND TYPE=command MSG="action:prompt_end"

    G28 X Y # rehome X & Y axis

    M118 Work lubricant into the bearings

    G90

    # --------------------------------------------------------
    # X AXIS
    # --------------------------------------------------------

    LED_ON   

    M118 LUBRICATION: X Axis

    G1 X10 F{xy_speed}

    {% for i in range(x_cycles) %}
        G1 X260 F{xy_speed}
        G1 X10 F{xy_speed}
    {% endfor %}

    G1 X135 # when finished move to centre position

    M400

    # --------------------------------------------------------
    # Y AXIS
    # --------------------------------------------------------

    LED_ON   

    M118 LUBRICATION: Y Axis

    G1 Y10 F{xy_speed}

    {% for i in range(y_cycles) %}
        G1 Y260 F{xy_speed}
        G1 Y10 F{xy_speed}
    {% endfor %}

    G1 Y30 # when finished move to the front of bed

    M400

    # --------------------------------------------------------
    # Z AXIS
    # --------------------------------------------------------
    
    LED_ON

    M118 LUBRICATION: Z Axis

    {% for i in range(z_cycles) %}
       G1 Z240 F{z_speed}
       G1 Z5 F{z_speed}
    {% endfor %}

    M400

    # --------------------------------------------------------
    # FINISH POSITION
    # --------------------------------------------------------

    LED_ON

    G1 Z240 F1000 # Bed lowered to safe lubrication position

    G1 X135 Y40 F3000 # Toolhead front centre

    M400

    # Release X and Y motors for final wipe
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0

    M118 WIPE AWAY EXCESS LUBRICANT

    BEEP DUR=100

    # --------------------------------------------------------
    # FINAL WIPE / FINISH PROMPT
    # --------------------------------------------------------

    RESPOND TYPE=command MSG="action:prompt_begin Lubrication Complete"
    RESPOND TYPE=command MSG="action:prompt_text Lubrication complete, wipe away excess lube"
    RESPOND TYPE=command MSG="action:prompt_button FINISHED|FINISH_LUBRICATION"
    RESPOND TYPE=command MSG="action:prompt_show"

# ============================================================
# FINISH LUBRICATION
# ============================================================

[gcode_macro FINISH_LUBRICATION]
description: Complete lubrication maintenance and reset timer

gcode:

    RESPOND TYPE=command MSG="action:prompt_end"

    SAVE_VARIABLE VARIABLE=lubrication_hours VALUE=0
    SAVE_VARIABLE VARIABLE=lubrication_due VALUE=0

    {% set interval = printer["gcode_macro LUBRICATION_SETTINGS"].interval|float %}

    M118 TIMER RESET - NEXT SERVICE IN {interval|round(1)} HOURS OF PRINTING TIME

    #BEEP  DUR=100


# ============================================================
# LUBRICATION TIME UPDATE
# ============================================================

[gcode_macro UPDATE_LUBRICATION_TIME]
description: Add completed print time to lubrication counter

gcode:

    {% set print_time = printer.print_stats.print_duration|float %}
    {% set old_total = printer.save_variables.variables.lubrication_hours|default(0)|float %}
    {% set interval = printer["gcode_macro LUBRICATION_SETTINGS"].interval|float %}
    {% set new_total = old_total + (print_time / 3600.0) %}

    SAVE_VARIABLE VARIABLE=lubrication_hours VALUE={new_total}

    {% if new_total >= interval %}
        SAVE_VARIABLE VARIABLE=lubrication_due VALUE=1
        M118 LUBRICATION DUE
    {% endif %}

     M118 LUBRICATION ELAPSED TIME: {new_total|round(2)} HOURS

# ============================================================
# LUBRICATION REMINDER CHECK
# ============================================================

[gcode_macro CHECK_LUBRICATION]
description: Check whether lubrication maintenance is due

gcode:

    {% set due = printer.save_variables.variables.lubrication_due|default(0)|int %}
    {% set hours = printer.save_variables.variables.lubrication_hours|default(0)|float %}
    {% set interval = printer["gcode_macro LUBRICATION_SETTINGS"].interval|float %}

    {% if due == 1 and printer.print_stats.state == "standby" %}

        M118 LUBRICATION: SERVICE REQUIRED

        RESPOND TYPE=command MSG="action:prompt_begin Lubrication Required"
        RESPOND TYPE=command MSG="action:prompt_text Printer has completed {hours|round(2)} hours of printing. Lubrication maintenance is due."
        RESPOND TYPE=command MSG="action:prompt_button Lubricate Now|START_LUBRICATION"
        RESPOND TYPE=command MSG="action:prompt_button Remind Me Later|LUBRICATION_REMIND_LATER"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% endif %}

# ============================================================
# LUBRICATION REMIND LATER
# ============================================================

[gcode_macro LUBRICATION_REMIND_LATER]
description: Dismiss lubrication reminder without resetting timer

gcode:

    RESPOND TYPE=command MSG="action:prompt_end"

    M118 LUBRICATION: REMIND LATER

