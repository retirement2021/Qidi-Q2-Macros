# =====================
# SCREWS_TILT
# =====================

[gcode_macro SCREWS_TILT]
description: Heat, home, wipe nozzle and measure bed screws
gcode:

    {% set brush_y = range(283, 289) | random %} # helps to preserve the silicone brush

    M118 SCREWS TILT IN PROGRESS

    LED_ON

    M140 S50 # start to heat bed

    {% if "xyz" not in printer.toolhead.homed_axes %} # Home printer if required
        M118 Homing printer...
        G28
    {% endif %}

    MOVE_TO_TRASH 

    M400 # finish move above

    M118 WAITING FOR TEMPERATURES

    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=45 # wait for bed to reach 45c before moving on

    M104 S200 # start to heat nozzle

   

    M190 S50   # wait for bed temp
    
    M104 S140  # start to lower temp to reduce oozing

    M204 S5000

    G1 X103 F5000 # Shake ooze
    G1 X90 F5000
    G1 X103 F5000
