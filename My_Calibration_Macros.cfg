    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    M400
    G1 Z1 F600

    M106 S255  # cooling fan 100%

    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180 # wait for nozzle to cool to 180C before moving on

    G1 Y{brush_y} F6000  # Randomise the Y axis brush cleaning position
    G1 X161 F3000        # move to brush
    M400                 # finsh above move
    G1 Z-1.5             # drop nozzle into the brush

    G1 X164 F12000
