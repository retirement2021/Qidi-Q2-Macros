# =====================
# PID BED TUNING
#======================

[gcode_macro PID_BED]
description: PID Tune for the Bed, change "default temp" if required
gcode:

    M118 PID BED TUNING IN PROGRESS

    {% set TARGET_TEMP = params.TARGET_TEMP|default(60)|float %} # temp can be adjusted in macro label

    {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
       M118 Homing printer...
       G28
    {% endif %}

    G1 X135 Y135 Z10 # move to centre of bed

    PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP}

    TURN_OFF_HEATERS

    G4 P1000 # dwell

    SAVE_CONFIG

    MY_MOVE_TO_TRASH

    BEEP DUR=100

    M118 PID_BED FINISHED

# =====================
# PID EXTRUDER TUNING
# =====================

[gcode_macro PID_EXTRUDER]
description: PID Tune for the Extruder, change "default temp" if required
gcode:

    M118 PID EXTRUDER TUNING IN PROGRESS

    {% set TARGET_TEMP = params.TARGET_TEMP|default(235)|float %} # temp can be adjusted in macro label

    {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
