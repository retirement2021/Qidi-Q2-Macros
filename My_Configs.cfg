#--Q2 sept 2026--
# ============
# START PRINT
# ============
[gcode_macro PRINT_START]

gcode:

    AUTOTUNE_SHAPERS 

    DISABLE_ALL_SENSOR # turns off filament runout sensor*

    CLEAR_PAUSE

    {% set bedtemp = params.get('BED') | int %}

    {% set hotendtemp = params.get('HOTEND') | int %}

    {% set chambertemp = params.get('CHAMBER', 0) | int %}

    {% set extruder = params.EXTRUDER|default(0)|int %}


    M118 PRINT SEQUENCE STARTED

    M140 S{bedtemp}  # start bed heating*

    {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.*
        M118 homing printer...
        G28
    {% endif %} 


    {% if chambertemp == 0 %} 

        M106 P3 S0              # EXTRACT FAN: original M106 P3 S255(100%), options M106 P3 S85(33%) or S127(50%) or S170(66%)*

    {% endif %}


    M141 S{chambertemp}  # chamber heater set in the slicer*  

    SET_GCODE_OFFSET Z=0 MOVE=0

    M118 CLEAR & CLEAN NOZZLE

    MY_CLEAR_NOZZLE HOTEND={hotendtemp} 


    M118 Z_TILT_ADJUST                         

    Z_TILT_ADJUST #  Z tilt adjust*

    M400


    M118 WAITING FOR TEMPERATURES

    M190 S{bedtemp}     # wait for bed temp final temp*

    M191 S{chambertemp} # wait for chamber temp, if asked for*


    M118 KAMP ADAPTIVE BED MESH

    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=ADAPTIVE PROBE_COUNT=7,7 

    SMART_PARK                      

    # G0 Z50 F600         # use instead of SMART PARK*
    # G0 X260 Y5 F30000  # use instead of SMART PARK*

    M118 WAITING FOR EXTRUDER TEMPERATURE

    M109 S{hotendtemp} # waiting for extruder final temp*

    M204 S8000  # ORIGINAL 10000. extruder acceleration*

    set_zoffset

    save_last_file

    M118 PRINT STARTED

    LINE_PURGE  # KAMP's purge line*

# ====================
# PRINT_END
# ====================

    [gcode_macro MY_PRINT_END]
gcode:
    M400
    save_zoffset

    UPDATE_LUBRICATION_TIME # routine lubrication timer

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    M106 P4 S0                                                     # 关闭空调
    # M106 P3 S0
    DISABLE_BOX_HEATER
    
    M104 S0
    M140 S0
    M141 S0

    M220 S100
    M221 S100
    M84
	
    DISABLE_ALL_SENSOR
    {% if printer.save_variables.variables.box_count >= 1 and printer.save_variables.variables.enable_box == 1 and printer["box_extras"]%}
        BUFFER_MONITORING ENABLE=0
    {% endif %}
#    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    G31
    CLEAR_LAST_FILE
    BEEP I=2 DUR=500
    # SDCARD_RESET_FILE
    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready 

# =========================
# CANCEL PRINT + LUBRICATION
# =========================

[gcode_macro CANCEL_PRINT]
rename_existing: QIDI_CANCEL_PRINT
gcode:

    UPDATE_LUBRICATION_TIME

    QIDI_CANCEL_PRINT

    UPDATE_DELAYED_GCODE ID=LUBRICATION_IDLE_CHECK DURATION=120    



# ============================================================
# LOAD FILAMENT. PART-1
# ============================================================

[gcode_macro LOAD_FILAMENT]

description: Load filament - choose filament type

gcode:

    BEEP DUR=100

    RESPOND TYPE=command MSG="action:prompt_begin FILAMENT LOAD"

    RESPOND TYPE=command MSG="action:prompt_text INSERT FILAMENT INTO THE EXTRUDER"

    RESPOND TYPE=command MSG="action:prompt_text CHOOSE FILAMENT & PURGE LENGTH"

    RESPOND TYPE=command MSG="action:prompt_show"

    RESPOND TYPE=command MSG="action:prompt_footer_button PLA/PETG 20mm|LOAD_FILAMENT_PLA_PETG|primary"

    RESPOND TYPE=command MSG="action:prompt_footer_button PLA/PETG 45mm|LOAD_FILAMENT_PETG_PLA|primary"
    
    RESPOND TYPE=command MSG="action:prompt_footer_button ASA/ABS 45mm|LOAD_FILAMENT_ASA_ABS|primary"  


# ============================================================
# LOAD PLA_PETG FILAMENT. PART-2
# ============================================================

[gcode_macro LOAD_FILAMENT_PLA_PETG]

description: Load filament, purge 20mm @225c

gcode:

    RESPOND TYPE=command MSG="action:prompt_end"

    M118 LOADING TPU/PLA/PETG FILAMENT, 20mm TO PURGE

    M104 S225

    {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
    M118 Homing printer...
    G28
    {% endif %} 

    MOVE_TO_TRASH

    M109 S225

    G4 P10000 # pause to stablise nozzle temp

    M118 NOZZLE HOT, LOADING FILAMENT

    G92 E0
    M83
    G1 E55 F400 # feed filament into extruder
    M400        # finish move above
    G4 P3000    # dwell
    G1 E20 F200 # 20mm purge
    G1 E-2 F300 # retract a little
    M400
    M104 S140   # call for lower nozzle temp to reduce oozing

    M204 S5000

    
    G1 X103 F5000 # Shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

   
    G1 X114 F5000 # Move to roller and wipe nozzle
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    M400

    M118  FILAMENT LOADED, 20mm PURGED

    RESPOND TYPE=command MSG="action:prompt_end"

    #G1 X135 Y135 F6000 # move to the centre of bed

    BEEP DUR=100


