# ============================================================
# UNLOAD FILAMENT. PART-1
# ============================================================

[gcode_macro UNLOAD_FILAMENT]

description: Unload filament - choose filament type

gcode:

    BEEP DUR=300

    RESPOND TYPE=command MSG="action:prompt_begin FILAMENT UNLOAD"

    RESPOND TYPE=command MSG="action:prompt_text REMOVE THE PRINT FROM THE BUILD PLATE"

    RESPOND TYPE=command MSG="action:prompt_text CHOOSE FILAMENT TEMPERATURE"

    RESPOND TYPE=command MSG="action:prompt_footer_button TPU_PLA_PETG UNLOAD|UNLOAD_FILAMENT_PLA_PETG|primary"

    RESPOND TYPE=command MSG="action:prompt_footer_button ASA_ABS UNLOAD|UNLOAD_FILAMENT_ASA_ABS|primary"

    RESPOND TYPE=command MSG="action:prompt_show"


# ============================================================
# STANDARD UNLOAD - 220C. PART-2
# ============================================================

[gcode_macro UNLOAD_FILAMENT_PLA_PETG]

description: PLA/PETG/TPU filament unload at 220C

gcode:

    
    {% set brush_y = range(283, 289) | random %} # helps to preserve the silicone brush
    # Close the Fluidd prompt
    RESPOND TYPE=command MSG="action\:prompt_end"

    M118 TPU/PLA/PETG FILAMENT UNLOAD

    # Start heating nozzle
    M104 S220

    {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
    M118 Homing printer...
    G28	
    {% endif %} 

    # Move directly to Qidi unload position
    MOVE_TO_TRASH

    # Wait for nozzle to reach temperature
    M109 S220

    M118 NOZZLE HOT - UNLOADING

    # Retract filament #
    #G92 E0
    #G1 E5
    #G4 500
    #G1 E-70 F600

    G92 E0
    G1 E5
    G4 500
    G1 E-10 F300  # Retract filament to cutter
    M400

    CUT_FILAMENT_1 # cut filament
    M400

    MOVE_TO_TRASH # Move back to trash position
    G92 E0
    G1 E-60 F300 # Pull filament completely out
    M400
    
    M104 S0 # Turn nozzle heater off

    M204 S5000

    G1 X103 F5000  # Shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000 # Shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    M118 DROPPING NOZZLE TEMPERATURE 
    M106 S255  # cooling fan
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150

    G1 Y{brush_y} F6000  # Randomise the Y axis brush cleaning position
    G1 X161 F3000        # move to brush
    M400                 # finsh above move
    G1 Z-1.5             # drop nozzle into the brush

    G1 X164 F12000 # brush sequence
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 Z1 # raise bed a little
    M400

    M106 S0 ' turn cooling fan off

    
    MOVE_TO_TRASH # Move directly to unload position

    BEEP DUR=100

    M118 UNLOAD FINISHED, REMOVE FILAMENT

    RESPOND TYPE=command MSG="action:prompt_end"

    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready


