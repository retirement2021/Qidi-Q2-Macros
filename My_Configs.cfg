# =================
# PAUSE AT LAYER
# =================

[gcode_macro SET_CURRENT_LAYER]
description: Store the current print layer
variable_layer: 0
gcode:
    SET_GCODE_VARIABLE MACRO=SET_CURRENT_LAYER VARIABLE=layer VALUE={params.LAYER|int}


[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause at the start of the next layer
variable_enabled: 0
variable_target_layer: 0
gcode:
    {% set current = printer["gcode_macro SET_CURRENT_LAYER"].layer | int %}
    {% set enable = params.ENABLE | default(1) | int != 0 %}

    {% if enable %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=1
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=target_layer VALUE={current + 1}
        {action_respond_info("Pause enabled for next layer: %d" % (current + 1))}
    {% else %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=0
        {action_respond_info("Pause at next layer disabled")}
    {% endif %}


[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause at a specified layer
variable_enabled: 0
variable_target_layer: 0
gcode:
    {% if params.ENABLE is defined and params.ENABLE | int == 0 %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=0
        {action_respond_info("Pause at layer disabled")}
    {% elif params.LAYER is defined %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=1
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=target_layer VALUE={params.LAYER|int}
        {action_respond_info("Pause enabled for layer: %d" % (params.LAYER|int))}
    {% else %}
        {action_respond_info("Specify a layer, for example: SET_PAUSE_AT_LAYER LAYER=37")}
    {% endif %}


[gcode_macro _CHECK_LAYER_PAUSE]
description: Check whether the current layer should pause
gcode:
    {% set current = printer["gcode_macro SET_CURRENT_LAYER"].layer | int %}

    {% if printer["gcode_macro SET_PAUSE_AT_LAYER"].enabled | int and current == printer["gcode_macro SET_PAUSE_AT_LAYER"].target_layer | int %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=0
        PAUSE
        {action_respond_info("Paused at layer %d" % current)}
    {% endif %}

    {% if printer["gcode_macro SET_PAUSE_NEXT_LAYER"].enabled | int and current == printer["gcode_macro SET_PAUSE_NEXT_LAYER"].target_layer | int %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=0
        PAUSE
        {action_respond_info("Paused at layer %d" % current)}
    {% endif %}


[temperature_sensor Host_CPU]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor toolhead]
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100

[gcode_macro ALL_HEATERS_OFF]
description: Turn all heaters off
gcode:
    M104 S0
    M140 S0
    M141 S0

# ===============
# MY-CLEAR_NOZZLE
# ===============

[gcode_macro MY_CLEAR_NOZZLE]

gcode:

    {% set hotendtemp = params.HOTEND|default(250)|int %} # set hot end temp
    {% set brush_y = range(283, 289) | random %}  # parameters of random brush wiping

    MOVE_TO_TRASH
       M109 S{hotendtemp} # wait for nozzle temp
       M400

    # AUTO LOAD/EXTRUDE FILAMENT
    G92 E0  # set extruder position
    G1 E5 F80  # extrude
    G92 E0
    G1 E20 F300  # extrude, ORIGINAL E80
    G92 E0
    G1 E-2 F200  # retract

    M400 # finish above moves

    M106 S192 # start cooling fan @ 75%
    M104 S140 # start dropping the temperature of the nozzle
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp-30}  # Wait until the extruder temperature is at or below 30°C less than hotendtemp (225C)
    M204 S5000  # set acceleration

    G1 X103 F5000  # Shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X114 F5000 # wiping the nozzle
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000 # shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X125 F15000

    G1 X130 Y280 F6000

    G1 Z-0.2 F600

    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150

    G2 I0.5 J0.5 F600  #3rd stage before the silicone brush
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 X140 F200

    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Z0.2

    G1 X180 F12000

    
    G1 Y{brush_y} F6000 # Randomise the silicone brush cleaning position Y axis

    G1 Z-1.5

    G1 X164 F12000 # randonised Y axis silicone brush cleaning
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000

    M400  # wait for above to finish

    M118 Nozzle cleared

    #G1 Z30 F900
    #G1 Y10 F18000
    #G1 X260 F18000

    M106 S0  # stop the cooling fan

# ===========
# BED MESH
# ===========

[gcode_macro PROBE_BED]
description: Full bed mesh calibration
gcode:

    M118 START HEATING THE BED

    # Start heating bed while nozzle is being cleaned
    M140 S50

    BED_MESH_CLEAR

    SET_STEPPER_ENABLE STEPPER=extruder enable=0

    # Home only if required
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    M118 NOZZLE WIPE

    # Move to Qidi's nozzle cleaning area
    MOVE_TO_TRASH

    # Heat nozzle - NO FILAMENT IS EXTRUDED
    M109 S200

    # Qidi nozzle wipe movements
    M204 S5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    # Qidi's second wipe area
    G1 X125 F15000
    G1 X130 Y280 F6000
    G1 Z-0.2 F600

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 X140 F200
    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Z0.2
    G1 X180 F12000
    G1 Z-1.5

    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000

    M400

    # Cool nozzle back to 140C
    M104 S140

    # Wait for bed to reach mesh temperature
    M190 S50

    M118 PROBE THE BED 9X9

    # Perform the KAMP bed mesh
    BED_MESH_CALIBRATE PROFILE=full_bed_9x9

    SAVE_VARIABLE VARIABLE=profile_name VALUE='"full_bed_9x9"'

    G4 P5000

    # Turn bed heater off
    M140 S0

    # Single beep
    BEEP DUR=200

    M104 S0

    G1 X135 Y135 Z10
    
    M118 FINISHED BED MESH

    SAVE_CONFIG_QD