    G1 X164 F12000
    G1 Z1
    M400

    M106 S0 ' turn cooling fan off

    # Move directly to unload position
    MOVE_TO_TRASH

    BEEP DUR=100

    M118 UNLOAD FINISHED, REMOVE FILAMENT

    RESPOND TYPE=command MSG="action:prompt_end"

    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready


