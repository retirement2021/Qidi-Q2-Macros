# =====================
# PID BED TUNING
#======================

[gcode_macro PID_BED]
description: PID Tune for the Bed, change "default temp" if required
gcode:

   M118 PID BED TUNING IN PROGRESS
   
  {% set TARGET_TEMP = params.TARGET_TEMP|default(60)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
    M118 Homing printer...
    G28	
    {% endif %} 
   
  G1 X135 Y135 Z10

  PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS
  SAVE_CONFIG
  G4 P1000
  BEEP DUR=100
  M118 PID FINISHED

# =====================
# PID EXTRUDER TUNING
# =====================

[gcode_macro PID_EXTRUDER]
description: PID Tune for the Extruder, change "default temp" if required
gcode:
    
    M118 PID EXTRUDER TUNING IN PROGRESS

    {% set TARGET_TEMP = params.TARGET_TEMP|default(235)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
    M118 Homing printer...
    G28	
    {% endif %} 

    G1 X135 Y135 Z10

  PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS
  SAVE_CONFIG
  G4 P1000
  BEEP DUR=100
  M118 PID FINISHED

# =================
# PAUSE AT LAYER
# =================

[gcode_macro SET_CURRENT_LAYER]
description: Store the current print layer
variable_layer: 0
gcode:
    SET_GCODE_VARIABLE MACRO=SET_CURRENT_LAYER VARIABLE=layer VALUE={params.LAYER|int}


[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause at the start of the next layer
variable_enabled: 0
variable_target_layer: 0
gcode:
    {% set current = printer["gcode_macro SET_CURRENT_LAYER"].layer | int %}
    {% set enable = params.ENABLE | default(1) | int != 0 %}

    {% if enable %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=1
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=target_layer VALUE={current + 1}
        {action_respond_info("Pause enabled for next layer: %d" % (current + 1))}
    {% else %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=0
        {action_respond_info("Pause at next layer disabled")}
    {% endif %}


[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause at a specified layer
variable_enabled: 0
variable_target_layer: 0
gcode:
    {% if params.ENABLE is defined and params.ENABLE | int == 0 %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=0
        {action_respond_info("Pause at layer disabled")}
    {% elif params.LAYER is defined %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=1
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=target_layer VALUE={params.LAYER|int}
        {action_respond_info("Pause enabled for layer: %d" % (params.LAYER|int))}
    {% else %}
        {action_respond_info("Specify a layer, for example: SET_PAUSE_AT_LAYER LAYER=37")}
    {% endif %}


[gcode_macro _CHECK_LAYER_PAUSE]
description: Check whether the current layer should pause
gcode:
    {% set current = printer["gcode_macro SET_CURRENT_LAYER"].layer | int %}

    {% if printer["gcode_macro SET_PAUSE_AT_LAYER"].enabled | int and current == printer["gcode_macro SET_PAUSE_AT_LAYER"].target_layer | int %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=0
        PAUSE
        {action_respond_info("Paused at layer %d" % current)}
    {% endif %}

    {% if printer["gcode_macro SET_PAUSE_NEXT_LAYER"].enabled | int and current == printer["gcode_macro SET_PAUSE_NEXT_LAYER"].target_layer | int %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=0
        PAUSE
        {action_respond_info("Paused at layer %d" % current)}
    {% endif %}


[temperature_sensor Host_CPU]  # additional temp
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor toolhead]  # Additional temp
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100

[gcode_macro ALL_HEATERS_OFF]
description: Turn all heaters off
gcode:
    M104 S0
    M140 S0
    M141 S0

# ===============
# MY-CLEAR_NOZZLE
# ===============

[gcode_macro MY_CLEAR_NOZZLE]

gcode:

    {% set hotendtemp = params.HOTEND|default(250)|int %} # set hot end temp
    {% set brush_y = range(283, 289) | random %}  # parameters of random brush wiping

    MOVE_TO_TRASH
       M109 S{hotendtemp} # wait for nozzle temp
       M400

    # AUTO LOAD/EXTRUDE FILAMENT
    G92 E0  # set extruder position
    G1 E5 F80  # extrude 5mm
    G92 E0
    G1 E20 F300  # extrude 20mm, ORIGINAL E80
    G92 E0
    G1 E-2 F200  # retract 2mm

    M400 # finish above moves

    M106 S255 # start cooling fan 
    M104 S140 # start dropping the temperature of the nozzle
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp-30}  # Wait until the extruder temperature is at or below 30°C less than hotendtemp (225C)
    M204 S5000  # set acceleration

    G1 X103 F5000  # Shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X114 F5000 # wipe the nozzle
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000 # shake ooze
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X125 F15000

    G1 X130 Y280 F6000

    G1 Z-0.2 F600

    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150

    G2 I0.5 J0.5 F600  
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 X140 F200

    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Z0.2

    G1 X180 F12000

    G1 Y{brush_y} F6000  # Randomise the Y axis brush cleaning position
    G1 X161 F3000        # move to brush
    M400                 # finsh above move
    G1 Z-1.5             # drop nozzle into the brush
    

    G1 X164 F12000 # brush clean
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 Z5  # raise bed a little

    M400  # wait for above to finish

    M118 NOZZLE CLEARED

    #G1 Z30 F900
    #G1 Y10 F18000
    #G1 X260 F18000

    M106 S0  # stop the cooling fan

# ===========
# BED MESH
# ===========

[gcode_macro PROBE_BED]
description: Full bed mesh calibration
gcode:

    M118 BED MESH CALIBRATION IN PROGRESS

    M140 S50 # Start heating bed while nozzle is being cleaned

    {% set brush_y = range(283, 289) | random %}  # parameters of random brush wiping

    BED_MESH_CLEAR

    SET_STEPPER_ENABLE STEPPER=extruder enable=0

    {% if "xyz" not in printer.toolhead.homed_axes %}  # Home only if required
        M118 Homing printer...
        G28
    {% endif %}

    M118 NOZZLE WIPE

    MOVE_TO_TRASH # Move to nozzle cleaning area

    M109 S200 # Heat nozzle 

    M204 S5000

    G1 X103 F5000 # shake ooze sequence
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    M106 S255 # start cooling fan 100%
    M104 S140 # start to Cool nozzle back to 140C

    TEMPURATURE_WAIT_SENSOR = extruder MAXIMUM = 160  # wait for temp to reduce to 160C to proceed

    G1 X125 F15000
    G1 X130 Y280 F6000
    G1 Z-0.2 F600

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 X140 F200
    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Z0.2
    G1 X180 F6000
    G1 Y{brush_y} F6000  # Randomise the Y axis brush cleaning position
    G1 X161 F3000        # move to brush
    M400                 # finsh above move
    G1 Z-1.5             # drop nozzle into the brush

    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 Z5  # raise bed a little

    M400 # finish above moves before moving on

    M106 S0  # stop the cooling fan
   
    M190 S50 # Wait for bed to reach temperature

    M118 PROBE THE BED 9X9

    BED_MESH_CALIBRATE PROFILE=full_bed_9x9 # Perform the KAMP bed mesh

    SAVE_VARIABLE VARIABLE=profile_name VALUE='"full_bed_9x9"'

    G4 P5000 # dwell

    M140 S0 # Turn bed heater off

    #G1 X135 Y135 Z10 # move to centre of bed
    MOVE_TO_TRASH 
    
    M118 FINISHED BED MESH

    BEEP DUR=100 # Single beep

    SAVE_CONFIG_QD

# ============================================================
# LUBRICATION MAINTENANCE SETTINGS
# ============================================================

[gcode_macro LUBRICATION_SETTINGS]

variable_interval: 30.0
# Lubrication interval in printing hours

variable_x_cycles: 3
# Number of X full-travel cycles

variable_y_cycles: 3
# Number of Y full-travel cycles

variable_z_cycles: 1
# Number of Z up/down cycles

variable_xy_speed: 45
# X/Y lubrication speed in mm/s

variable_z_speed: 15
# Z lubrication speed in mm/s

gcode:
    # Settings only

# ============================================================
# AUTOMATIC LUBRICATION STARTUP CHECK
# ============================================================

[delayed_gcode LUBRICATION_STARTUP_CHECK]
initial_duration: 5

gcode:

    CHECK_LUBRICATION

# ============================================================
# START LUBRICATION
# ============================================================

[gcode_macro START_LUBRICATION]
description: Prepare printer for lubrication

gcode:

    {% if "xyz" not in printer.toolhead.homed_axes %}

        M118 LUBRICATION: HOMING PRINTER

        G28

    {% endif %}

    M118 LUBRICATION: PREPARING PRINTER

    G90   
    # Move bed to safe lubrication position
    G1 Z246 F800

    # Move toolhead to front centre
    G1 X135 Y40 F3000

    M400

     # Release X and Y motors so toolhead can be moved by hand
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0

    M118 LUBRICATION: X/Y MOTORS RELEASED
    M118 MOVE TOOLHEAD BY HAND FOR CLEANING/LUBRICATION

    RESPOND TYPE=command MSG="action:prompt_begin Lubrication Maintenance"
    RESPOND TYPE=command MSG="action:prompt_text Lubricate the X rods/rails, Y rods/rails and Z screws. When finished, press the button below."
    RESPOND TYPE=command MSG="action:prompt_button LUBRICANT APPLIED|RUN_LUBRICATION_CYCLES"
    RESPOND TYPE=command MSG="action:prompt_show"

# ============================================================
# RUN LUBRICATION CYCLES
# ============================================================

[gcode_macro RUN_LUBRICATION_CYCLES]
description: Work lubricant into X Y and Z mechanisms

gcode:

    {% set x_cycles = printer["gcode_macro LUBRICATION_SETTINGS"].x_cycles|int %}
    {% set y_cycles = printer["gcode_macro LUBRICATION_SETTINGS"].y_cycles|int %}
    {% set z_cycles = printer["gcode_macro LUBRICATION_SETTINGS"].z_cycles|int %}

    {% set xy_speed = printer["gcode_macro LUBRICATION_SETTINGS"].xy_speed|float * 60 %}
    {% set z_speed = printer["gcode_macro LUBRICATION_SETTINGS"].z_speed|float * 60 %}

    # Close the lubrication popup
    RESPOND TYPE=command MSG="action:prompt_end"

    # Re-home X and Y because they were moved by hand
    M118 LUBRICATION: RE-HOMING X/Y
    G28 X Y

    M118 LUBRICATION: WORKING LUBRICANT IN

    G90

    # --------------------------------------------------------
    # X AXIS
    # --------------------------------------------------------

    M118 LUBRICATION: X AXIS

    G1 X10 F{xy_speed}

    {% for i in range(x_cycles) %}
        G1 X260 F{xy_speed}
        G1 X10 F{xy_speed}
    {% endfor %}

    G1 X135

    M400

    # --------------------------------------------------------
    # Y AXIS
    # --------------------------------------------------------

    M118 LUBRICATION: Y AXIS

    G1 Y10 F{xy_speed}

    {% for i in range(y_cycles) %}
        G1 Y260 F{xy_speed}
        G1 Y10 F{xy_speed}
    {% endfor %}

    G1 Y30

    M400

    # --------------------------------------------------------
    # Z AXIS
    # --------------------------------------------------------

    M118 LUBRICATION: Z AXIS

    # Start at the bottom of the Z cycle
    G1 Z5 F{z_speed}

    {% for i in range(z_cycles) %}
        G1 Z200 F{z_speed}
        G1 Z10 F{z_speed}
    {% endfor %}

    M400

    # --------------------------------------------------------
    # FINISH POSITION
    # --------------------------------------------------------

    #M118 LUBRICATION: MOVING TO FINISH POSITION

    # Bed lowered to safe lubrication position
    G1 Z243 F800

    # Toolhead front centre
    G1 X135 Y20 F3000

    M400

    # Release X and Y motors for final wipe
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0

    #M118 LUBRICATION: X/Y MOTORS RELEASED
    M118 WIPE AWAY EXCESS LUBRICANT

    #BEEP DUR=100

    # --------------------------------------------------------
    # FINAL WIPE / FINISH PROMPT
    # --------------------------------------------------------

    RESPOND TYPE=command MSG="action:prompt_begin Lubrication Complete"
    RESPOND TYPE=command MSG="action:prompt_text Lubrication cycle complete. Move the toolhead by hand as required and wipe away any excess lubricant. When finished, press FINISHED."
    RESPOND TYPE=command MSG="action:prompt_button FINISHED|FINISH_LUBRICATION"
    RESPOND TYPE=command MSG="action:prompt_show"

# ============================================================
# FINISH LUBRICATION
# ============================================================

[gcode_macro FINISH_LUBRICATION]
description: Complete lubrication maintenance and reset timer

gcode:

    RESPOND TYPE=command MSG="action:prompt_end"

    SAVE_VARIABLE VARIABLE=lubrication_hours VALUE=0
    SAVE_VARIABLE VARIABLE=lubrication_due VALUE=0

    {% set interval = printer["gcode_macro LUBRICATION_SETTINGS"].interval|float %}

    M118 LUBRICATION COMPLETE
    M118 TIMER RESET - NEXT SERVICE IN {interval|round(1)} HOURS OF PRINTING TIME

    BEEP  DUR=100


# ============================================================
# LUBRICATION TIME UPDATE
# ============================================================

[gcode_macro UPDATE_LUBRICATION_TIME]
description: Add completed print time to lubrication counter

gcode:

    {% set print_time = printer.print_stats.print_duration|float %}
    {% set old_total = printer.save_variables.variables.lubrication_hours|default(0)|float %}
    {% set interval = printer["gcode_macro LUBRICATION_SETTINGS"].interval|float %}
    {% set new_total = old_total + (print_time / 3600.0) %}

    SAVE_VARIABLE VARIABLE=lubrication_hours VALUE={new_total}

    {% if new_total >= interval %}
        SAVE_VARIABLE VARIABLE=lubrication_due VALUE=1
        M118 LUBRICATION DUE
    {% endif %}

     M118 LUBRICATION TIME: {new_total|round(2)} HOURS

# ============================================================
# LUBRICATION REMINDER CHECK
# ============================================================

[gcode_macro CHECK_LUBRICATION]
description: Check whether lubrication maintenance is due

gcode:

    {% set due = printer.save_variables.variables.lubrication_due|default(0)|int %}
    {% set hours = printer.save_variables.variables.lubrication_hours|default(0)|float %}
    {% set interval = printer["gcode_macro LUBRICATION_SETTINGS"].interval|float %}

    {% if due == 1 and printer.print_stats.state == "standby" %}

        M118 LUBRICATION REQUIRED

        RESPOND TYPE=command MSG="action:prompt_begin Lubrication Required"
        RESPOND TYPE=command MSG="action:prompt_text Printer has completed {hours|round(2)} hours of printing. Lubrication maintenance is due."
        RESPOND TYPE=command MSG="action:prompt_button Lubricate Now|START_LUBRICATION"
        RESPOND TYPE=command MSG="action:prompt_button Remind Me Later|LUBRICATION_REMIND_LATER"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% endif %}

# ============================================================
# LUBRICATION REMIND LATER
# ============================================================

[gcode_macro LUBRICATION_REMIND_LATER]
description: Dismiss lubrication reminder without resetting timer

gcode:

    RESPOND TYPE=command MSG="action:prompt_end"

    M118 LUBRICATION REMINDER DISMISSED
    M118 Lubrication remains due    